name: Release

# Pushing a tag such as v1.0.0 builds the `littlesql` shell for Linux,
# macOS and Windows and the playground, and publishes them as a GitHub
# release whose notes are that version's section of CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  shell:
    name: Shell (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x86_64, exe: "" }
          - { os: macos-14, name: macos-arm64, exe: "" }
          - { os: windows-2022, name: windows-x86_64, exe: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p littlesql-cli
      - name: Package
        shell: bash
        run: |
          dir="littlesql-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/littlesql${{ matrix.exe }}" README.md LICENSE "$dir"/
          if [ "${{ matrix.exe }}" = ".exe" ]; then
            7z a "$dir.zip" "$dir" >/dev/null
          else
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.name }}
          path: littlesql-*.*

  playground:
    name: Playground
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlite3 (builds the demo database)
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Build
        run: scripts/build-playground.sh
      - name: Package
        run: |
          dir="littlesql-playground-${GITHUB_REF_NAME}"
          cp -r playground/dist "$dir"
          zip -qr "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: playground
          path: littlesql-playground-*.zip

  publish:
    name: Publish the release
    needs: [shell, playground]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (on) exit; if (index($0, "[" v "]")) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Little SQL $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
